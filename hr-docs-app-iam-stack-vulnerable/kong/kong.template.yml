# Kong DB-less (declarative). File này là TEMPLATE: config-init (config-init/render.py) điền
# issuer, public key RS256 (lấy từ realm Keycloak lúc khởi động) và dải IP nội bộ (INTERNAL_CIDRS trong .env)
# rồi ghi ra kong.yml cho container kong.
_format_version: "3.0"
_transform: true

services:
  - name: hrdocs-api
    url: http://api:8000
    connect_timeout: 5000
    read_timeout: 30000
    routes:
      - name: api-public            # không cần token: health check + tài liệu OpenAPI
        paths: [/api/health, /api/docs, /api/openapi.json]
        strip_path: false
      - name: api                   # mọi API còn lại
        paths: [/api]
        strip_path: false
        plugins:
          # V-KONG-1: plugin JWT bị vô hiệu (enabled:false). Kong KHÔNG kiểm chữ ký/exp nữa;
          #   mọi lớp xác thực dồn hết cho API, mà API thì đã bị làm hỏng (xem V-JWT-*).
          # V-KONG-2: dù bật lại, cấu hình cũng yếu: claims_to_verify rỗng (bỏ kiểm exp) nên token hết hạn vẫn qua.
          # Bản secure: enabled mặc định (true), claims_to_verify:[exp], maximum_expiration:3600.
          - &jwt
            name: jwt
            enabled: false
            config:
              key_claim_name: iss
              claims_to_verify: []
              header_names: [authorization]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false
      - name: api-admin             # POST /admin/users, GET /admin/audit
        paths: [/api/admin]
        strip_path: false
        # V-KONG-3: gỡ plugin ip-restriction khỏi route admin (R5 ở gateway không còn).
        # Bản secure: route này có plugin ip-restriction chỉ cho phép ${INTERNAL_CIDRS_YAML}.
        plugins:
          - *jwt
      - name: api-document-delete   # DELETE /documents/{id}
        paths: ["~/api/documents/[^/]+$"]
        methods: [DELETE]
        strip_path: false
        # V-KONG-3: tương tự, không còn chặn IP cho endpoint xóa tài liệu.
        plugins: [*jwt]

consumers:
  - username: keycloak-realm-hrdocs
    jwt_secrets:
      - key: "${KEYCLOAK_ISSUER}"
        algorithm: RS256
        rsa_public_key: |
${KEYCLOAK_PUBLIC_KEY}

plugins:
  # Mỗi request một X-Request-Id; FastAPI dùng lại làm request_id để nối log Kong <-> log ứng dụng.
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  # Log HTTP của gateway dạng JSON ra stdout -> Grafana Alloy -> Loki (job="kong").
  # Bỏ header Authorization khỏi log để token không nằm trong kho log.
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
      custom_fields_by_lua:
        request.headers.authorization: "return nil"
        request.headers.cookie: "return nil"
  # Chống dò quét/brute force đơn giản theo IP.
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      limit_by: ip
