# Casbin (phương án dự phòng cho OPA): mô hình ABAC, mỗi dòng policy là (action, điều kiện, allow/deny, mã quy tắc).
# Dòng khớp ĐẦU TIÊN theo thứ tự trong policy.csv quyết định (giống chuỗi else của Rego); không khớp dòng nào = deny.
[request_definition]
r = sub, obj, act, env

[policy_definition]
p = act, cond, eft, rule

[policy_effect]
e = priority(p.eft) || deny

[matchers]
m = r.act == p.act && eval(p.cond)
